<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GeeSweetStore</title>
<style>
body{
font-family:Arial;
background:#fff5ee;
margin:0;
}
header{
background:brown;
color:white;
text-align:center;
padding:20px;
}
.products{
display:flex;
flex-wrap:wrap;
justify-content:center;
padding:20px;
}
.card{
background:white;
width:220px;
margin:15px;
padding:15px;
border-radius:12px;
box-shadow:0 4px 8px rgba(0,0,0,0.2);
text-align:center;
}
.card img{
width:100%;
height:150px;
object-fit:contain;
}
button{
background:brown;
color:white;
border:none;
padding:8px 15px;
border-radius:8px;
cursor:pointer;
}
footer{
background:brown;
color:white;
text-align:center;
padding:20px;
}
</style>
</head>
<body>

<header>
<h1>🍫 GeeSweetStore 🍭</h1>
<p>Affordable Sweet Shop</p>
</header>

<div class="products">

<div class="card">
<img src="tex.jpg">
<h3>Tex</h3>
<p>R2</p>
<button>Buy</button>
</div>

<div class="card">
<img src="chomp.png">
<h3>Chomp</h3>
<p>R3</p>
<button>Buy</button>
</div>

<div class="card">
<img src="lunchbar.png">
<h3>Lunch Bar</h3>
<p>R4</p>
<button>Buy</button>
</div>

<div class="card">
<img src="kitkat.jfif">
<h3>KitKat</h3>
<p>R5</p>
<button>Buy</button>
</div>

<div class="card">
<img src="jellytots.jfif">
<h3>Jelly Tots</h3>
<p>R3</p>
<button>Buy</button>
</div>

<div class="card">
<img src="pinpop.webp">
<h3>Pin Pop</h3>
<p>R2</p>
<button>Buy</button>
</div>

</div>

<footer>
<p>📧 pnkem31@gmail.com</p>
<p>📞 078 126 5678</p>
</footer>

</body>
</html>
